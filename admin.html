<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Moderação · Aveiro Cult</title>
  <link rel="icon" href="icones/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css?v=6">
</head>
<body>

<header class="topo">
  <a class="marca" href="./"><span class="a">Aveiro</span> <span class="c">Cult</span></a>
  <span class="topo-tit">Moderação</span>
  <button class="btn-sair" id="sair" type="button" hidden>Sair</button>
</header>

<main>
  <!-- Entrada -->
  <section class="entrada" id="entrada">
    <form class="cartao" id="formEntrar">
      <h1>Entrar</h1>
      <p>Só para a equipa do Aveiro Cult. Aqui aprovas ou rejeitas os eventos e portfólios enviados pelo público.</p>
      <label><span>Email</span><input name="email" type="email" required autocomplete="username"></label>
      <label><span>Palavra-passe</span><input name="senha" type="password" required autocomplete="current-password"></label>
      <p class="erro" id="erroEntrar" hidden></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </section>

  <!-- Painel -->
  <section class="painel" id="painel" hidden>
    <div class="modos" id="modos">
      <button class="on" data-modo="submissoes" type="button">Eventos e artistas</button>
      <button data-modo="noticias" type="button">Notícias</button>
      <button data-modo="parceiros" type="button">Parceiros</button>
    </div>
    <div id="modoSubmissoes">
    <div class="abas" id="abas">
      <button class="on" data-estado="pendente" type="button">Pendentes <b id="nPend">0</b></button>
      <button data-estado="aprovado" type="button">Aprovados <b id="nAprov">0</b></button>
      <button data-estado="rejeitado" type="button">Rejeitados <b id="nRej">0</b></button>
    </div>
    <div class="filtros">
      <label class="auto"><span>Publicação automática</span><select id="autoPublicar"><option value="nunca">Nunca: tudo passa por mim</option><option value="confiaveis">Quem já teve algo aprovado</option><option value="todos">Todos os que cumprem os critérios</option></select></label>
      <select id="filtroTipo"><option value="">Eventos e artistas</option><option value="evento">Só eventos</option><option value="artista">Só artistas</option></select>
      <button class="btn-leve" id="atualizar" type="button">Atualizar</button>
    </div>
    <div class="lista" id="lista"></div>
    <p class="vazio" id="vazio" hidden>Nada por aqui.</p>
    </div>

    <!-- Notícias -->
    <div id="modoNoticias" hidden>
      <div class="filtros">
        <button class="btn" id="novaNoticia" type="button">Nova notícia</button>
        <button class="btn-leve" id="atualizarNoticias" type="button">Atualizar</button>
        <span class="nota" id="nNoticias"></span>
      </div>
      <form class="editor" id="editorNoticia" hidden>
        <input type="hidden" name="id">
        <h3 id="editorTitulo">Nova notícia</h3>
        <label class="c-2"><span>Título *</span><input name="titulo" type="text" required maxlength="160"></label>
        <label class="c-2"><span>Resumo * <small>(1 a 2 frases; aparece nos cartões e no Google)</small></span><textarea name="resumo" required rows="2" maxlength="300"></textarea></label>
        <label class="c-2"><span>Texto da notícia <small>(deixa uma linha em branco entre parágrafos)</small></span><textarea name="corpo" rows="10" maxlength="12000"></textarea></label>
        <label><span>Categoria</span><select name="categoria"><option value="">Escolhe…</option></select></label>
        <label><span>Concelho</span><select name="concelho"><option value="">Escolhe…</option></select></label>
        <label><span>Data</span><input name="data" type="date" required></label>
        <label><span>Ligação externa <small>(opcional)</small></span><input name="link_original" type="url" placeholder="https://"></label>
        <label class="c-2"><span>Imagem <small>(JPEG, PNG ou WebP até 5 MB; fica reduzida a 1600 px)</small></span><input name="imagem" type="file" accept="image/jpeg,image/png,image/webp"><input type="hidden" name="imagem_atual"></label>
        <label class="c-check c-2"><input name="publicado" type="checkbox"><span>Publicada (visível no site e na app)</span></label>
        <div class="acoes c-2">
          <button class="btn" type="submit">Guardar</button>
          <button class="btn-leve" type="button" id="cancelarNoticia">Cancelar</button>
        </div>
      </form>
      <div class="lista" id="listaNoticias"></div>
      <p class="vazio" id="vazioNoticias" hidden>Ainda não há notícias.</p>
    </div>

    <!-- Parceiros (Empresas Amigas da Cultura) -->
    <div id="modoParceiros" hidden>
      <div class="filtros">
        <button class="btn" id="novoParceiro" type="button">Novo parceiro</button>
        <button class="btn-leve" id="atualizarParceiros" type="button">Atualizar</button>
        <span class="nota" id="nParceiros"></span>
      </div>
      <form class="editor" id="editorParceiro" hidden>
        <input type="hidden" name="id">
        <h3 id="editorParceiroTitulo">Novo parceiro</h3>
        <label><span>Nome da empresa *</span><input name="nome" type="text" required maxlength="120"></label>
        <label><span>Plano</span><select name="plano"><option value="">Sem plano</option><option>Apoiante</option><option>Bronze</option><option>Prata</option><option>Ouro</option><option>Platina</option><option>Parceria cultural</option></select></label>
        <label><span>Site ou rede social</span><input name="link" type="url" placeholder="https://"></label>
        <label><span>Ordem <small>(menor aparece primeiro)</small></span><input name="ordem" type="number" value="10" min="0" max="999"></label>
        <label class="c-2"><span>Logótipo <small>(PNG com fundo transparente fica melhor; até 5 MB)</small></span><input name="imagem" type="file" accept="image/jpeg,image/png,image/webp"><input type="hidden" name="imagem_atual"></label>
        <label class="c-check c-2"><input name="ativo" type="checkbox" checked><span>Ativo (visível no site e na app)</span></label>
        <div class="acoes c-2">
          <button class="btn" type="submit">Guardar</button>
          <button class="btn-leve" type="button" id="cancelarParceiro">Cancelar</button>
        </div>
      </form>
      <div class="lista" id="listaParceiros"></div>
      <p class="vazio" id="vazioParceiros" hidden>Ainda não há parceiros.</p>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/admin.js?v=6"></script>
</body>
</html>
